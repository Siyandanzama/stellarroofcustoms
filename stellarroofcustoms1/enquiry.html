<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Sterllar Roof Customs</title>
     <!-- CSS Link -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">StellarRoof <span class="purple-text">Customs</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="service.html">Service</a></li>
                <li><a href="enquiry.html" style="color: #9d4edd;">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section style="padding: 140px 0 80px 0; text-align: center;">
        <div class="container" style="max-width: 600px;">
            <h2 style="font-size: 36px; margin-bottom: 15px;">Enquiry Form</h2>
            <p style="opacity: 0.7; margin-bottom: 40px;">Tell us about your ride and we will contact you with an exact build date.</p>

            <form style="background: #111; padding: 40px; border-radius: 15px; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom: 8px; font-size: 14px; font-weight:600;">Name and Surname</label>
                    <input type="text" placeholder="John Doe" style="width:100%; padding: 12px; background:#222; border:1px solid #333; color:white; border-radius:8px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom: 8px; font-size: 14px; font-weight:600;">Email</label>
                    <input type="email" placeholder="john@example.com" style="width:100%; padding: 12px; background:#222; border:1px solid #333; color:white; border-radius:8px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom: 8px; font-size: 14px; font-weight:600;">Phone Number</label>
                    <input type="tel" placeholder="081 561 8492" style="width:100%; padding: 12px; background:#222; border:1px solid #333; color:white; border-radius:8px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom: 8px; font-size: 14px; font-weight:600;">Service Interested In</label>
                    <select style="width:100%; padding: 12px; background:#222; border:1px solid #333; color:white; border-radius:8px;">
                        <option>Basic Package</option>
                        <option>Premium Package</option>
                        <option>Custom Design</option>
                    </select>
                </div>

                <div style="margin-bottom: 30px;">
                    <label style="display:block; margin-bottom: 8px; font-size: 14px; font-weight:600;">Message / Vehicle Model</label>
                    <textarea rows="4" placeholder="Tell us your car make, model and year..." style="width:100%; padding: 12px; background:#222; border:1px solid #333; color:white; border-radius:8px; font-family:inherit; resize: none;"></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer; font-weight: bold;">Submit Request</button>
            </form>
        </div>
    </section>
     <!-- Footer -->
   <footer>
        <p>&copy; 2026 StellarRoof Customs. Engineered Elegance.</p>
    </footer>

</main>
</body>
</html>
